$engine: 3
$minFxVersion: 5181
$onesync: on
name: Arca Framework
version: 0.1.0
author: Arca
description: Arca framework (arca_core, arca_target, arca_character) with oxmysql.

tasks:
  # Default CFX resources (chat, spawnmanager, sessionmanager, etc.)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources

  # oxmysql
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  # ox_lib (required by illenium-appearance, not by Arca itself)
  - action: download_file
    path: ./tmp/ox_lib.zip
    url: https://github.com/overextended/ox_lib/releases/latest/download/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[standalone]

  # illenium-appearance
  - action: download_file
    path: ./tmp/illenium-appearance.zip
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/latest/download/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[standalone]

  # Arca
  - action: download_github
    src: https://github.com/Arca-Framework/arca_core
    dest: ./resources/[arca]/arca_core
  - action: download_github
    src: https://github.com/Arca-Framework/arca_target
    dest: ./resources/[arca]/arca_target
  - action: download_github
    src: https://github.com/Arca-Framework/arca_character
    dest: ./resources/[arca]/arca_character
  # Uncomment as these get built (and add their ensure lines below):
  # - action: download_github
  #   src: https://github.com/Arca-Framework/arca_spawn
  #   dest: ./resources/[arca]/arca_spawn
  - action: download_github
    src: https://github.com/Arca-Framework/arca_hud
    dest: ./resources/[arca]/arca_hud
  - action: download_github
    src: https://github.com/Arca-Framework/arca_loadingscreen
    dest: ./resources/[arca]/arca_loadingscreen
  # - action: download_github
  #   src: https://github.com/Arca-Framework/arca_phone
  #   dest: ./resources/[arca]/arca_phone
  # - action: download_github
  #   src: https://github.com/Arca-Framework/arca_identity
  #   dest: ./resources/[arca]/arca_identity
  # - action: download_github
  #   src: https://github.com/Arca-Framework/arca_inventory
  #   dest: ./resources/[arca]/arca_inventory

  # Database
  - action: connect_database
  - action: query_database
    file: ./resources/[arca]/arca_core/sql/arca.sql

  # Cleanup
  - action: remove_path
    path: ./tmp

  # server.cfg
  - action: write_file
    file: ./server.cfg
    data: |
      ## Generated by the Arca txAdmin recipe
      {{serverEndpoints}}

      sv_maxclients {{maxClients}}
      set steam_webApiKey "none"
      sv_licenseKey "{{svLicense}}"
      sv_hostname "Arca Framework"
      sets sv_projectName "Arca"
      sets sv_projectDesc "Built on the Arca framework"
      sets tags "arca, roleplay"
      sv_enforceGameBuild 3258

      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_ui true

      ## Default CFX resources
      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure hardcap

      ## Core dependencies (order matters: arca_core must start before
      ## illenium-appearance so it detects the qb-core bridge)
      ensure oxmysql
      ensure ox_lib
      ensure arca_core

      ## Everything else in the folders
      ensure [standalone]
      ensure [arca]

      ## Permissions
      add_ace group.admin command allow
      add_ace group.admin arca.god allow
      add_ace resource.arca_core command.add_ace allow
      add_ace resource.arca_core command.remove_ace allow
      add_ace resource.arca_core command.add_principal allow
      add_ace resource.arca_core command.remove_principal allow
      {{addPrincipalsMaster}}
